<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" style="background-color: #FFFFFF; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Crisp Gradients for Light Mode -->
    <linearGradient id="aafaqGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="horizonGlowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK -->
  <g transform="translate(20, 20)">
    <!-- Base Outer Modular Arc -->
    <path d="M 10 65 A 36 36 0 0 1 70 20" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <path d="M 10 65 A 36 36 0 0 1 65 15" fill="none" stroke="url(#aafaqGradLight)" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 120" />
    
    <!-- Outer Node Dots -->
    <circle cx="65" cy="15" r="3.5" fill="#0284C7" />
    <circle cx="74" cy="38" r="2.5" fill="#4F46E5" />
    <circle cx="10" cy="65" r="2.5" fill="#CBD5E1" />

    <!-- Ascending Steps / Goal Breakdown Bars -->
    <rect x="22" y="48" width="7" height="14" rx="2.5" fill="#F1F5F9" />
    <rect x="32" y="39" width="7" height="23" rx="2.5" fill="url(#aafaqGradLight)" opacity="0.7" />
    <rect x="42" y="28" width="7" height="34" rx="2.5" fill="url(#aafaqGradLight)" opacity="0.95" />
    
    <!-- Dynamic Arrow Head -->
    <path d="M52 18 L52 30 L44 30 L52 18 Z" fill="url(#aafaqGradLight)" />
    <path d="M20 52 L34 38 L44 26 L58 12" fill="none" stroke="url(#horizonGlowLight)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="58" cy="12" r="3.5" fill="#0284C7" />
  </g>

  <!-- LOGO TEXT & TYPOGRAPHY -->
  <g transform="translate(115, 68)">
    <!-- Main Brand Name -->
    <text x="0" y="0" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      AAFAQ<tspan fill="#0284C7">.</tspan>
    </text>

    <!-- Subtitle / Platform Mission -->
    <text x="2" y="22" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2.5">
      HOLISTIC GROWTH PLATFORM
    </text>
  </g>
</svg>
